# ============================================================
# NETLIFY - Configuration CAMPAB Frontend
# ============================================================

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

# Plugin Next.js (obligatoire)
[[plugins]]
  package = "@netlify/plugin-nextjs"

# ============================================================
# REDIRECTIONS
# ============================================================
[[redirects]]
  from = "/home"
  to = "/"
  status = 301

# Rediriger les anciens liens WordPress ou autres
[[redirects]]
  from = "/index.php"
  to = "/"
  status = 301

# ============================================================
# HEADERS DE SÉCURITÉ
# ============================================================
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Cache long pour les assets statiques
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"